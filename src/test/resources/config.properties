# ============================================
# Test Automation Framework Configuration
# ============================================

# Browser Configuration
# Options: chrome, firefox, edge, headless
browser=chrome

# Environment Name (for reporting)
environment=Test

# Base URL - The website to test
baseUrl=https://opensource-demo.orangehrmlive.com

# Timeouts (in seconds)
defaultTimeout=10
pageLoadTimeout=30
implicitWait=5

# Screenshot Settings
screenshotOnFailure=true
screenshotPath=target/screenshots

# Test Data
testDataPath=src/test/resources/testdata

# Reporting
reportPath=target/reports

# Headless Mode
headlessMode=false

# ============================================
# Email Configuration (Optional - Mailtrap API)
# ============================================
# Set email.enabled=true and configure below to receive email reports

email.enabled=true
email.method=api

# Mailtrap API Settings
# Get your API Token from: Mailtrap > Settings > API Tokens
email.mailtrap.apiToken=5cd6e816e7fc822ed15e704dd7c96d0c
email.mailtrap.inboxId=4281924

# Email details
email.sender=test@automation.com
email.senderName=Test Automation
email.recipients=vishal.lodhia987@gmail.com

# How to get these values:
# 1. Go to https://mailtrap.io
# 2. Click on your profile (top right) > Settings > API Tokens
# 3. Create a new token and copy it
# 4. Go to Email Testing > Inboxes > My Inbox
# 5. The Inbox ID is in the URL: .../inboxes/INBOX_ID
