name: Java Selenium CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up headless Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run TestNG suite via Maven
        run: mvn -B clean test -Dheadless=true
        env:
          HEADLESS: 'true'

      - name: Upload Surefire test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/

      - name: Upload Extent/Allure report (if generated)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            test-output/
            allure-results/
          if-no-files-found: ignore

      - name: Publish TestNG summary
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: TestNG Results
          path: target/surefire-reports/*.xml
          reporter: java-junit
